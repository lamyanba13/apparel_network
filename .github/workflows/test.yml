name: Test and Build

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FASHION_NETWORK_ENVIRONMENT: test
      FASHION_NETWORK_DATABASE_URL: postgresql+asyncpg://fashion_network:fashion_network_test@localhost:5432/fashion_network_test
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: fashion_network_test
          POSTGRES_USER: fashion_network
          POSTGRES_PASSWORD: fashion_network_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashion_network -d fashion_network_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install backend dependencies
        run: poetry --directory backend install --no-interaction

      - name: Run tests
        run: poetry --directory backend run pytest

  web:
    name: Web tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build applications
        run: pnpm build
