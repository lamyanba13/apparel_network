[project]
name = "fashion-network-backend"
version = "0.1.0"
description = "Fashion Network modular-monolith backend foundation"
authors = [{ name = "Fashion Network Engineering" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = ">=0.115,<1.0"
sqlalchemy = ">=2.0,<3.0"
alembic = ">=1.14,<2.0"
pydantic-settings = ">=2.7,<3.0"
uvicorn = { version = ">=0.34,<1.0", extras = ["standard"] }
celery = ">=5.6,<6.0"
flower = ">=2.0,<3.0"
asyncpg = ">=0.31,<1.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary", "pool"] }
redis = ">=6.0,<7.0"
uuid6 = ">=2025.0.1,<2026.0.0"
brotli = ">=1.2,<2.0"
httpx = ">=0.28,<1.0"
prometheus-client = ">=0.22,<1.0"
sentry-sdk = { version = ">=2.0,<3.0", extras = ["fastapi"] }
opentelemetry-api = ">=1.38,<2.0"
opentelemetry-sdk = ">=1.38,<2.0"
opentelemetry-exporter-otlp-proto-http = ">=1.38,<2.0"
opentelemetry-instrumentation-fastapi = ">=0.59b0,<1.0"
opentelemetry-instrumentation-sqlalchemy = ">=0.59b0,<1.0"
opentelemetry-instrumentation-httpx = ">=0.59b0,<1.0"
opentelemetry-instrumentation-celery = ">=0.59b0,<1.0"
pwdlib = {version = ">=0.3,<1.0", extras = ["argon2"]}
pyjwt = {version = ">=2.10,<3.0", extras = ["crypto"]}
python-multipart = ">=0.0.20,<1.0"
pillow = ">=11.3,<13.0"
minio = ">=7.2,<8.0"
cryptography = ">=50.0.0,<51.0.0"
openpyxl = ">=3.1,<4.0"

[tool.poetry.group.dev.dependencies]
black = ">=25.1,<27.0"
httpx2 = ">=2.9,<3.0"
mypy = ">=1.14,<2.0"
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=1.0,<2.0"
pytest-cov = ">=6.0,<8.0"
ruff = ">=0.9,<1.0"
pip-audit = ">=2.9,<3.0"
types-openpyxl = ">=3.1,<4.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
    "opentelemetry.instrumentation.celery",
]
ignore_missing_imports = true
follow_untyped_imports = false
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
